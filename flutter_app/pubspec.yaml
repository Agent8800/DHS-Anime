name: donghuahub
description: Modern Donghua streaming application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.0.0

  # UI
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_animate: ^4.3.0
  lottie: ^3.0.0
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  glassmorphism: ^3.0.0
  percent_indicator: ^4.2.3
  flutter_staggered_animations: ^1.1.1
  skeletonizer: ^1.0.1
  smooth_page_indicator: ^1.1.0

  # Video Player
  better_player: ^0.0.84
  wakelock_plus: ^1.2.1

  # Networking
  dio: ^5.4.0
  graphql_flutter: ^5.1.2

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0
  path_provider: ^2.1.2

  # Auth (Google-only sign-in via Clerk; email/password is not used)
  clerk_flutter: ^0.0.12-beta
  clerk_auth: any # exact version is pinned by clerk_flutter
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.10

  # Utils
  intl: ^0.19.0
  share_plus: ^7.2.1
  url_launcher: ^6.2.2
  connectivity_plus: ^5.0.2
  package_info_plus: ^5.0.1
  permission_handler: ^11.1.0
  device_info_plus: ^10.1.0
  image_picker: ^1.0.7
  flutter_local_notifications: ^16.3.2
  timeago: ^3.6.1
  uuid: ^4.2.2
  json_annotation: ^4.8.1
  equatable: ^2.0.5
  dartz: ^0.10.1
  freezed_annotation: ^2.4.1

  # Downloads (episodes from third-party links to device storage)
  flutter_downloader: ^1.11.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  freezed: ^2.4.5
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  hive_generator: ^2.0.1
  mockito: ^5.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/fonts/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
